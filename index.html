<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================================================================
         SEO / SOCIAL META — kept in sync with src/config/site.ts.
         Because index.html is static it can't import the config; update both.
         =================================================================== -->

    <!-- Primary -->
    <title>Sophia Ming · Map Illustrator & Graphic Designer</title>
    <meta
      name="description"
      content="Portfolio of Sophia Ming (Ming Designs). Illustrated site maps, 2D and 3D community map renderings, branding, and packaging from North Carolina."
    />
    <link rel="canonical" href="https://mingdesigns.com/" />
    <meta name="theme-color" content="#fdfaf3" />
    <meta name="author" content="Sophia Ming" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ming Designs" />
    <meta property="og:title" content="Sophia Ming · Map Illustrator & Graphic Designer" />
    <meta
      property="og:description"
      content="Illustrated site maps, 2D and 3D community map renderings, branding, and packaging by Sophia Ming."
    />
    <meta property="og:url" content="https://mingdesigns.com/" />
    <meta property="og:image" content="https://mingdesigns.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ming Designs, Sophia Ming's portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sophia Ming · Map Illustrator & Graphic Designer" />
    <meta
      name="twitter:description"
      content="Illustrated site maps, 2D and 3D community map renderings, branding, and packaging by Sophia Ming."
    />
    <meta name="twitter:image" content="https://mingdesigns.com/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Ming Designs, Sophia Ming's portfolio"
    />

    <!-- Icons / manifest -->
    <link rel="icon" href="/mingdesigns/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/mingdesigns/apple-touch-icon.png" />
    <link rel="manifest" href="/mingdesigns/site.webmanifest" />

    <!-- Fonts: preconnect + stylesheet (kept out of index.css @import to avoid
         a render-blocking request chain). Anton stands in for the brand's
         Interstate Compressed Bold (and appears in Sophie's own exhibit
         files); Source Sans 3 matches the Source Sans Variable she packaged.
         Weights must cover every font-* utility used: Source Sans 3 400–700. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <script type="module" crossorigin src="/mingdesigns/assets/index-CeefhsqC.js"></script>
    <link rel="stylesheet" crossorigin href="/mingdesigns/assets/index-CcPhk9ax.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
